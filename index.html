<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Costa Rica en Cifras · Costa Rica in Numbers</title>
<meta name="description" content="Pobreza, ingresos y regiones de Costa Rica explicados en palabras sencillas, con datos oficiales del INEC (ENAHO 2016–2025). Poverty, income and regions in Costa Rica explained in plain words.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

  /* =========================================================
     DESIGN TOKENS
     ========================================================= */
  :root{
    --navy:#040046;            /* fondo oscuro */
    --paper:#f8faff;           /* fondo claro */
    --surface:#ffffff;
    --accent:#ff651d;          /* brand orange — surfaces & decoration only */
    --accent-strong:#c2410c;   /* orange for text & buttons (5.2:1 on white) */
    --accent-strong-hover:#a8380a;
    --secondary:#2500c4;

    /* strata */
    --c-extreme:#c2101e; --c-poverty:#f9691d; --c-vulnerable:#ffa922; --c-secure:#28469e; --c-comfort:#d2e3e3;

    /* charts (validated for color-vision deficiency on white) */
    --s-total:#e8560f;  --s-extreme:#4a3aff;  --s-ref:#868ba5;
    --slot-a:#e8560f;   --slot-b:#4a3aff;
    --grid:#e2e6f0;

    /* ink */
    --ink:#040046; --ink-2:#545281; --line:rgba(4,0,70,.12);
    --on-dark:#f8faff; --on-dark-2:#bbbcd1;

    --font:'Urbanist', system-ui, sans-serif;
    /* 7-step type scale */
    --t-xs:12px; --t-sm:14px; --t-md:16px; --t-lg:20px; --t-xl:28px; --t-2xl:40px; --t-3xl:64px;

    --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:40px; --s6:56px; --s7:72px; --s8:96px;
    --r-card:35px; --r-inner:22px; --r-pop:18px; --r-pill:100px;
    --shadow-pop:0 12px 32px -8px rgba(4,0,70,.28), 0 2px 6px rgba(4,0,70,.08);
    --nav-h:60px;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; scroll-padding-top:calc(var(--nav-h) + 12px); }
  body{ margin:0; font-family:var(--font); background:var(--navy); color:var(--ink); -webkit-font-smoothing:antialiased; overflow-x:clip; }
  h1,h2,h3,p{ margin:0; }
  ul{ margin:0; padding:0; list-style:none; }
  button{ font-family:inherit; border:none; cursor:pointer; background:none; color:inherit; }
  input{ font-family:inherit; }
  img{ display:block; max-width:100%; }
  :focus-visible{ outline:3px solid var(--secondary); outline-offset:2px; }
  .dark :focus-visible{ outline-color:var(--accent); }
  .visually-hidden{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .skip{ position:absolute; left:16px; top:-60px; z-index:100; background:var(--paper); color:var(--ink); padding:12px 18px; border-radius:12px; font-weight:700; }
  .skip:focus{ top:12px; }

  /* ========================= NAV ========================= */
  .nav{ position:sticky; top:0; z-index:50; background:rgba(4,0,70,.96); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); border-bottom:1px solid rgba(248,250,255,.1); }
  .nav__inner{ max-width:1200px; margin:0 auto; height:var(--nav-h); display:flex; align-items:center; gap:var(--s3); padding:0 var(--s3); }
  .nav__brand{ color:var(--on-dark); font-weight:800; font-size:var(--t-md); text-decoration:none; white-space:nowrap; min-height:44px; display:inline-flex; align-items:center; }
  .nav__links{ display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; margin-left:auto; }
  .nav__links::-webkit-scrollbar{ display:none; }
  .nav__links a{ color:var(--on-dark-2); text-decoration:none; font-size:var(--t-sm); font-weight:600; padding:0 14px; min-height:44px; display:inline-flex; align-items:center; border-radius:var(--r-pill); white-space:nowrap; }
  .nav__links a:hover{ color:var(--on-dark); background:rgba(248,250,255,.08); }
  .nav__links a[aria-current="true"]{ color:var(--navy); background:var(--paper); }

  /* ========================= LAYOUT ========================= */
  .section{ padding:var(--s7) var(--s6); }
  .light{ background:var(--paper); color:var(--ink); }
  .dark{ background:var(--navy); color:var(--on-dark); }
  .inner{ max-width:1200px; margin:0 auto; }
  .head{ margin-bottom:var(--s4); max-width:760px; }
  .eyebrow{ font-size:var(--t-sm); font-weight:700; color:var(--accent-strong); margin-bottom:6px; display:block; }
  .dark .eyebrow{ color:#ffb38a; }
  .title{ font-weight:800; font-size:var(--t-xl); line-height:1.15; text-wrap:balance; }
  .lead{ font-size:var(--t-lg); line-height:1.45; margin-top:var(--s1); color:var(--ink-2); }
  .dark .lead{ color:var(--on-dark-2); }
  .prose{ font-size:var(--t-lg); line-height:1.55; max-width:72ch; }
  .prose strong{ font-weight:800; }
  .prose + .prose{ margin-top:var(--s2); }
  .card{ background:var(--surface); color:var(--ink); border-radius:var(--r-card); padding:var(--s4); min-width:0; }
  .light .card{ box-shadow:0 0 0 1px var(--line); }
  .card__title{ font-weight:700; font-size:var(--t-lg); line-height:1.25; }
  .card__note{ font-size:var(--t-sm); color:var(--ink-2); }
  .card__head{ display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:var(--s2); }
  .help{ font-size:var(--t-xs); color:var(--ink-2); line-height:1.4; display:block; margin-top:4px; }

  /* ========================= HERO ========================= */
  .hero{ background:var(--navy); padding:var(--s4) var(--s6) var(--s7); display:flex; justify-content:center; }
  .hero__frame{ position:relative; max-width:1200px; width:100%; min-height:600px; border-radius:var(--r-card); background:#020823; overflow:hidden; display:flex; align-items:center; }
  .hero__media{ position:absolute; top:0; bottom:0; right:0; width:66%; -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 22%); mask-image:linear-gradient(90deg, transparent 0, #000 22%); }
  .hero__img{ width:100%; height:100%; object-fit:cover; object-position:100% 20%; }
  .hero__card{ width:min(480px, 40%); }
  .hero__card{ position:relative; z-index:1; background:var(--paper); border-radius:var(--r-card); padding:var(--s5); max-width:480px; margin:var(--s5); display:flex; flex-direction:column; gap:var(--s3); box-shadow:0 20px 50px -20px rgba(4,0,70,.45); }
  .hero__lead{ font-size:var(--t-lg); line-height:1.35; }
  .hero__question{ font-weight:800; font-size:var(--t-2xl); line-height:1.08; text-wrap:balance; }
  .hero__finding{ font-size:var(--t-md); line-height:1.45; color:var(--ink-2); }
  .hero__finding b{ color:var(--ink); }
  .hero__actions{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; }

  /* ========================= BUTTONS ========================= */
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; background:var(--accent-strong); color:#fff; font-size:var(--t-md); font-weight:700; padding:0 24px; border-radius:var(--r-pill); text-decoration:none; white-space:nowrap; transition:background .15s ease, transform .15s ease; }
  .btn:hover{ background:var(--accent-strong-hover); transform:translateY(-1px); }
  .btn--ghost{ background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1.5px rgba(4,0,70,.25); }
  .btn--ghost:hover{ background:rgba(4,0,70,.05); }
  .chip{ display:inline-flex; align-items:center; min-height:44px; background:var(--paper); color:var(--navy); font-size:var(--t-sm); font-weight:600; padding:0 18px; border-radius:var(--r-pill); transition:background .15s ease, color .15s ease; }
  .chip:hover{ background:var(--secondary); color:#fff; }

  /* ========================= DROPDOWN ========================= */
  .dd{ position:relative; display:inline-block; min-width:0; }
  .dd__btn{ display:inline-flex; align-items:center; gap:10px; min-width:220px; min-height:52px; justify-content:space-between; background:var(--surface); color:var(--ink); border:1.5px solid rgba(4,0,70,.22); border-radius:var(--r-pill); padding:6px 10px 6px 18px; font-size:var(--t-md); font-weight:700; text-align:left; transition:border-color .15s ease, box-shadow .15s ease; }
  .dd__btn:hover{ border-color:var(--ink); }
  .dd__btn[aria-expanded="true"]{ border-color:var(--secondary); box-shadow:0 0 0 3px rgba(37,0,196,.14); }
  .dd__eyebrow{ display:block; font-size:var(--t-xs); font-weight:700; color:var(--ink-2); line-height:1.1; }
  .dd__value{ display:block; line-height:1.25; }
  .dd__chev{ flex-shrink:0; width:30px; height:30px; border-radius:50%; background:var(--accent-strong); color:#fff; display:grid; place-items:center; transition:transform .2s ease; }
  .dd__btn[aria-expanded="true"] .dd__chev{ transform:rotate(180deg); }
  .dd__list{ position:absolute; z-index:30; top:calc(100% + 8px); left:0; min-width:100%; width:max-content; max-width:min(340px, 90vw); max-height:360px; overflow:auto; background:var(--surface); color:var(--ink); border-radius:var(--r-pop); padding:6px; box-shadow:var(--shadow-pop); display:none; }
  .dd__list.is-open{ display:block; animation:pop .14s ease-out; }
  @keyframes pop{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:none; } }
  .dd__opt{ display:grid; grid-template-columns:18px 1fr auto; align-items:center; gap:10px; min-height:44px; padding:6px 12px; border-radius:12px; font-size:var(--t-md); font-weight:500; cursor:pointer; }
  .dd__opt[aria-selected="true"]{ font-weight:700; }
  .dd__opt.is-active{ background:rgba(37,0,196,.07); }
  .dd__check{ opacity:0; color:var(--secondary); }
  .dd__opt[aria-selected="true"] .dd__check{ opacity:1; }
  .dd__meta{ display:flex; align-items:center; gap:8px; font-size:var(--t-sm); font-weight:600; color:var(--ink-2); font-variant-numeric:tabular-nums; }
  .dd__bar{ width:56px; height:6px; border-radius:3px; background:var(--grid); overflow:hidden; }
  .dd__bar i{ display:block; height:100%; background:var(--s-total); border-radius:3px; }
  .dd__sep{ height:1px; background:var(--line); margin:4px 8px; }

  .seg{ display:inline-flex; background:rgba(4,0,70,.06); border-radius:var(--r-pill); padding:4px; gap:2px; }
  .seg button{ min-height:44px; padding:0 16px; border-radius:var(--r-pill); font-size:var(--t-sm); font-weight:700; color:var(--ink-2); display:inline-flex; align-items:center; gap:8px; }
  .seg button[aria-pressed="true"]{ background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(4,0,70,.18); }
  .pin{ display:inline-grid; place-items:center; width:24px; height:24px; border-radius:50%; color:#fff; font-size:var(--t-xs); font-weight:800; flex-shrink:0; box-shadow:0 0 0 2px #fff; }
  .pin--a{ background:var(--slot-a); } .pin--b{ background:var(--slot-b); }
  .filters{ display:flex; flex-wrap:wrap; align-items:center; gap:12px var(--s3); margin-bottom:var(--s3); }
  .filters__label{ font-size:var(--t-sm); color:var(--ink-2); font-weight:600; }

  /* ========================= WHERE DO YOU FIT ========================= */
  .fit{ display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap:var(--s3); align-items:start; }
  .field{ display:flex; flex-direction:column; gap:8px; margin-bottom:var(--s3); }
  .field label, .field .label{ font-size:var(--t-sm); font-weight:700; }
  .stepper{ display:inline-flex; align-items:center; gap:8px; }
  .stepper button{ width:48px; height:48px; border-radius:50%; background:var(--paper); box-shadow:inset 0 0 0 1.5px rgba(4,0,70,.2); font-size:var(--t-lg); font-weight:700; }
  .stepper button:hover{ box-shadow:inset 0 0 0 1.5px var(--ink); }
  .stepper output{ min-width:56px; text-align:center; font-size:var(--t-xl); font-weight:800; }
  .money{ display:flex; align-items:center; border:1.5px solid rgba(4,0,70,.22); border-radius:16px; padding:0 16px; min-height:56px; background:var(--surface); }
  .money:focus-within{ border-color:var(--secondary); box-shadow:0 0 0 3px rgba(37,0,196,.14); }
  .money span{ font-size:var(--t-lg); font-weight:700; color:var(--ink-2); }
  .money input{ border:none; outline:none; font-size:var(--t-lg); font-weight:700; width:100%; padding:12px 8px; color:var(--ink); background:transparent; font-variant-numeric:tabular-nums; }
  .fit__result{ display:flex; flex-direction:column; gap:var(--s3); }
  .verdict{ border-radius:var(--r-inner); padding:var(--s3); color:#fff; }
  .verdict--extreme{ background:var(--c-extreme); } .verdict--poverty{ background:#b54708; } .verdict--above{ background:var(--c-secure); }
  .verdict__label{ font-size:var(--t-sm); font-weight:700; opacity:.9; }
  .verdict__value{ font-size:var(--t-xl); font-weight:800; line-height:1.15; margin-top:4px; }
  .verdict__text{ font-size:var(--t-md); line-height:1.45; margin-top:8px; }
  .fit__stats{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:var(--s2); }
  .stat{ background:var(--paper); border-radius:var(--r-inner); padding:var(--s2) var(--s3); }
  .stat b{ display:block; font-size:var(--t-xl); font-weight:800; line-height:1.1; font-variant-numeric:tabular-nums; }
  .stat span{ font-size:var(--t-sm); color:var(--ink-2); }
  .scale{ position:relative; height:76px; margin-top:4px; }
  .scale__track{ position:absolute; left:0; right:0; top:34px; height:10px; border-radius:5px; background:linear-gradient(90deg, var(--c-extreme) 0 var(--x1), var(--c-poverty) var(--x1) var(--x2), var(--grid) var(--x2) 100%); }
  .scale__tick{ position:absolute; top:26px; width:2px; height:26px; background:var(--ink); }
  .scale__tick span{ position:absolute; top:30px; left:50%; transform:translateX(-50%); font-size:var(--t-xs); color:var(--ink-2); white-space:nowrap; }
  .scale__you{ position:absolute; top:0; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; transition:left .35s cubic-bezier(.2,.7,.2,1); }
  .scale__you b{ background:var(--ink); color:#fff; font-size:var(--t-xs); font-weight:800; padding:3px 10px; border-radius:var(--r-pill); white-space:nowrap; }
  .scale__you i{ width:2px; height:20px; background:var(--ink); }
  .fit__note{ font-size:var(--t-xs); color:var(--ink-2); line-height:1.5; }

  /* ========================= KPIs ========================= */
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap:var(--s4) var(--s4); }
  .kpi{ container-type:inline-size; min-width:0; }
  .kpi__label{ font-weight:700; font-size:var(--t-lg); margin-bottom:var(--s1); display:block; }
  .kpi__value{ font-weight:800; font-size:clamp(32px, 16cqi, var(--t-3xl)); line-height:1.05; display:block; white-space:nowrap; }
  .kpi__delta{ font-size:var(--t-md); font-weight:600; color:var(--accent-strong); margin-top:var(--s1); display:block; }

  /* ========================= STRATA ========================= */
  .strata-legend{ display:flex; flex-wrap:wrap; gap:var(--s2) var(--s3); margin-bottom:var(--s2); }
  .strata-legend li{ display:flex; align-items:center; gap:8px; font-size:var(--t-sm); }
  .dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .strata-bar{ display:flex; gap:2px; width:100%; height:48px; margin-bottom:var(--s6); }
  .strata-bar > div{ height:100%; display:flex; align-items:center; justify-content:center; position:relative; }
  .strata-bar > div:first-child{ border-radius:8px 0 0 8px; } .strata-bar > div:last-child{ border-radius:0 8px 8px 0; }
  .strata-bar span{ font-size:var(--t-sm); font-weight:800; white-space:nowrap; color:var(--navy); }
  .strata-bar .on-dark span{ color:#fff; }
  .strata-bar .narrow span{ position:absolute; top:calc(100% + 8px); left:0; color:var(--on-dark); }
  .strata-bar .narrow::after{ content:""; position:absolute; top:100%; left:50%; width:1px; height:6px; background:var(--on-dark); }

  /* ========================= INCOME LADDER ========================= */
  .mw__plot{ --lw:300px; position:relative; margin-top:var(--s3); padding-top:34px; }
  .mw__group{ font-size:var(--t-xs); font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-2); margin:18px 0 6px; }
  .mw__group:first-of-type{ margin-top:0; }
  .mw__row{ display:grid; grid-template-columns:var(--lw) minmax(0,1fr); align-items:center; min-height:44px; }
  .mw__label{ font-size:var(--t-md); font-weight:600; line-height:1.25; padding-right:16px; }
  .mw__label small{ display:block; font-size:var(--t-xs); color:var(--ink-2); font-weight:500; }
  .mw__track{ position:relative; height:20px; }
  .mw__bar{ position:absolute; left:0; top:0; height:20px; border-radius:0 4px 4px 0; }
  .mw__val{ position:absolute; z-index:2; top:50%; transform:translateY(-50%); font-size:var(--t-sm); font-weight:800; white-space:nowrap; color:var(--ink); font-variant-numeric:tabular-nums; background:var(--surface); padding:1px 4px; border-radius:4px; }
  .mw__val span{ font-weight:500; color:var(--ink-2); }
  .mw__val.in{ background:transparent; color:#fff; } .mw__val.in span{ color:rgba(255,255,255,.85); }
  .mw__ref{ position:absolute; top:0; bottom:0; width:0; border-left:2px dashed var(--ink); left:calc(var(--lw) + (100% - var(--lw)) * var(--x)); pointer-events:none; z-index:1; }
  .mw__ref-label{ position:absolute; top:0; left:8px; white-space:nowrap; background:var(--navy); color:#fff; font-size:var(--t-xs); font-weight:700; padding:4px 10px; border-radius:var(--r-pill); }
  .insights{ display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap:var(--s2); margin-top:var(--s3); }
  .insight{ background:var(--paper); border-radius:var(--r-inner); padding:var(--s2) var(--s3); }
  .insight b{ display:block; font-size:var(--t-xl); font-weight:800; line-height:1.1; }
  .insight span{ font-size:var(--t-sm); color:var(--ink-2); line-height:1.45; display:block; margin-top:4px; }
  .foot{ margin-top:var(--s3); font-size:var(--t-xs); color:var(--ink-2); line-height:1.55; }

  /* ========================= TREND ========================= */
  .trend-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap:var(--s5); align-items:start; margin-top:var(--s6); }
  .chart-wrap{ position:relative; }
  .chart-svg{ width:100%; height:auto; display:block; overflow:visible; touch-action:pan-y; }
  .chart-svg .grid-line{ stroke:var(--grid); stroke-width:1; }
  .chart-svg .axis{ font-family:var(--font); font-size:12px; fill:var(--ink-2); font-variant-numeric:tabular-nums; }
  .chart-svg .end{ font-family:var(--font); font-size:12px; font-weight:800; fill:var(--ink); }
  .chart-svg .note{ font-family:var(--font); font-size:11px; font-weight:700; fill:var(--ink-2); }
  .chart-svg .line{ fill:none; stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round; }
  .chart-svg .crosshair{ stroke:var(--ink); stroke-width:1; opacity:.35; }
  .legend{ display:flex; gap:var(--s3); flex-wrap:wrap; margin:0 0 var(--s2); }
  .legend span{ display:flex; align-items:center; gap:8px; font-size:var(--t-sm); }
  .legend i{ width:18px; height:3px; border-radius:2px; display:inline-block; }
  .caption{ margin-top:var(--s2); font-size:var(--t-md); line-height:1.5; color:var(--ink-2); }
  .caption b{ color:var(--ink); }
  .tooltip{ position:absolute; z-index:20; pointer-events:none; background:var(--navy); color:#fff; border-radius:14px; padding:10px 12px; min-width:150px; font-size:var(--t-sm); box-shadow:var(--shadow-pop); opacity:0; transition:opacity .1s ease; }
  .tooltip.on{ opacity:1; }
  .tooltip__title{ font-weight:700; margin-bottom:6px; opacity:.8; }
  .tooltip__row{ display:grid; grid-template-columns:14px auto 1fr; align-items:center; gap:8px; margin-top:3px; }
  .tooltip__row b{ font-size:var(--t-md); font-variant-numeric:tabular-nums; }
  .tooltip__row span:last-child{ opacity:.8; }
  .tooltip__key{ width:14px; height:3px; border-radius:2px; }
  details.data{ margin-top:var(--s2); font-size:var(--t-sm); }
  details.data summary{ cursor:pointer; color:var(--secondary); font-weight:700; min-height:44px; display:flex; align-items:center; }
  details.data th, details.data td{ font-size:var(--t-sm); padding:5px 8px; text-align:right; font-variant-numeric:tabular-nums; }
  details.data th:first-child, details.data td:first-child{ text-align:left; }
  table{ width:100%; border-collapse:collapse; }

  /* ========================= REGIONS ========================= */
  .regions-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 540px), 1fr)); gap:var(--s3); align-items:start; }
  .map-svg{ width:100%; height:auto; display:block; }
  .map-region{ stroke:#fff; stroke-width:1.5; cursor:pointer; transition:filter .15s ease; outline:none; }
  .map-region:hover, .map-region:focus-visible{ filter:brightness(1.08) saturate(1.1); stroke:var(--ink); stroke-width:2.5; }
  .map-region.sel-a{ stroke:var(--slot-a); stroke-width:4; }

/* ========================= DROPDOWN ========================= */
let ddN = 0;
function dropdown(host, { eyebrow, options, value, onChange }){
  const id = "dd" + (++ddN), wrap = E("div", "dd"), btn = E("button", "dd__btn");
  btn.type = "button"; btn.setAttribute("aria-haspopup", "listbox"); btn.setAttribute("aria-expanded", "false"); btn.setAttribute("aria-controls", id + "-l");
  const txt = E("span"), eb = E("span", "dd__eyebrow"), val = E("span", "dd__value");
  txt.append(eb, val);
  const chev = E("span", "dd__chev"); chev.setAttribute("aria-hidden", "true");
  chev.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>';
  btn.append(txt, chev);
  const list = E("ul", "dd__list"); list.id = id + "-l"; list.setAttribute("role", "listbox"); list.setAttribute("tabindex", "-1");
  let cur = value, act = 0, items = [];
  function build(){
    eb.textContent = eyebrow(); list.setAttribute("aria-label", eyebrow());
    const opts = options(); list.textContent = ""; items = [];
    opts.forEach((o, i) => {
      if (o.sep){ const s = E("li", "dd__sep"); s.setAttribute("role", "separator"); list.append(s); return; }
      const li = E("li", "dd__opt"); li.id = id + "-" + i; li.setAttribute("role", "option"); li.dataset.value = o.value;
      const ck = E("span", "dd__check"); ck.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L20 7"/></svg>';
      li.append(ck, E("span", null, o.label));
      if (o.meta != null){ const m = E("span", "dd__meta"); if (o.bar != null){ const b = E("span", "dd__bar"); const f = document.createElement("i"); f.style.width = Math.min(100, o.bar) + "%"; b.append(f); m.append(b); } m.append(document.createTextNode(o.meta)); li.append(m); }
      li.addEventListener("click", () => { select(o.value); close(); btn.focus(); });
      li.addEventListener("mousemove", () => setAct(items.indexOf(li)));
      list.append(li); items.push(li);
    });
    const o = opts.find(o => o.value === cur); val.textContent = o ? o.label : "";
    items.forEach(li => li.setAttribute("aria-selected", li.dataset.value === cur ? "true" : "false"));
  }
  function setAct(i){ act = Math.max(0, Math.min(items.length - 1, i)); items.forEach((li, j) => li.classList.toggle("is-active", j === act)); list.setAttribute("aria-activedescendant", items[act].id); items[act].scrollIntoView({ block:"nearest" }); }
  function open(){ list.classList.add("is-open"); btn.setAttribute("aria-expanded", "true"); setAct(Math.max(0, items.findIndex(li => li.dataset.value === cur))); list.focus(); }
  function close(){ list.classList.remove("is-open"); btn.setAttribute("aria-expanded", "false"); }
  function select(v, silent){ if (v === cur && !silent) return; cur = v; build(); if (!silent) onChange(v); }
  btn.addEventListener("click", () => list.classList.contains("is-open") ? close() : open());
  btn.addEventListener("keydown", e => { if (e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); open(); } });
  list.addEventListener("keydown", e => {
    if (e.key === "ArrowDown"){ e.preventDefault(); setAct(act + 1); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); setAct(act - 1); }
    else if (e.key === "Home"){ e.preventDefault(); setAct(0); }
    else if (e.key === "End"){ e.preventDefault(); setAct(items.length - 1); }
    else if (e.key === "Enter" || e.key === " "){ e.preventDefault(); select(items[act].dataset.value); close(); btn.focus(); }
    else if (e.key === "Escape"){ e.preventDefault(); close(); btn.focus(); }
    else if (e.key === "Tab"){ close(); }
  });
  document.addEventListener("pointerdown", e => { if (!wrap.contains(e.target)) close(); });
  wrap.append(btn, list); host.replaceWith(wrap); build();
  return { set: v => select(v, true), rebuild: build };
}

const st = { place:"cr", year:2025, a:"central", b:"caribe", slot:"a", zone:"urban", ppl:3, hover:null, lastHint:null };

const incomeEl = document.getElementById("income");
const parseIncome = () => Math.max(0, +String(incomeEl.value).replace(/[^\d]/g, "") || 0);
function renderFit(){
  const I = parseIncome(), n = st.ppl, pc = I / n, L = LINES[st.zone];
  let kind, title, text;
  if (pc < L.extreme){ kind = "extreme"; title = t("v_extreme"); text = t("v_extreme_t", { line:crc(L.extreme) }); }
  else if (pc < L.poverty){ kind = "poverty"; title = t("v_poverty"); text = t("v_poverty_t", { line:crc(L.poverty) }); }
  else { kind = "above"; title = t("v_above"); text = t("v_above_t", { x:(pc / L.poverty).toFixed(1), line:crc(L.poverty) }); }
  const v = document.getElementById("verdict"); v.className = "verdict verdict--" + kind; v.textContent = "";
  v.append(E("p", "verdict__label", t("v_label")), E("p", "verdict__value", title), E("p", "verdict__text", text));
  let qi = 0, best = Infinity; Q_PC.forEach((q, i) => { const d = Math.abs(Math.log(Math.max(pc, 1) / q)); if (d < best){ best = d; qi = i; } });
  const stats = document.getElementById("fitStats"); stats.textContent = "";
  [[crc(pc), t("f_pp")], [times(I), t("f_mw", { mw:crc(MIN_WAGE) })], [t("f_close"), t("f_close_t", { q:t("q_names")[qi], v:crc(Q_PC[qi]) })]]
    .forEach(([b, s], i) => { const c = E("div", "stat"); if (i === 2) c.style.gridColumn = "1 / -1"; c.append(E("b", null, b), E("span", null, s)); stats.append(c); });
  const MAX = 600000, x = v => Math.min(100, v / MAX * 100);
  const sc = document.getElementById("fitScale"); sc.textContent = "";
  sc.style.setProperty("--x1", x(L.extreme) + "%"); sc.style.setProperty("--x2", x(L.poverty) + "%");
  sc.append(E("div", "scale__track"));
  [[L.extreme, t("sc_extreme")], [L.poverty, t("sc_poverty")], [Q_PC[2], t("sc_mid")], [Q_PC[3], t("sc_q4")]].forEach(([v, l], j) => {
    const tk = E("div", "scale__tick " + ["t-ext","t-pov","t-q","t-q"][j]); tk.style.left = x(v) + "%"; const sp = E("span", null, l); if (j === 0) sp.style.transform = "translateX(-80%)"; if (j === 1) sp.style.transform = "translateX(-10%)"; tk.append(sp); sc.append(tk); });
  const you = E("div", "scale__you"); you.style.left = Math.max(4, Math.min(96, x(pc))) + "%";
  you.append(E("b", null, pc > MAX ? t("sc_you") + " →" : t("sc_you")), document.createElement("i")); sc.append(you);
  sc.setAttribute("role", "img"); sc.setAttribute("aria-label", t("sc_aria", { pc:crc(pc), e:crc(L.extreme), p:crc(L.poverty) }));
}
function setPpl(n){ st.ppl = Math.max(1, Math.min(12, n)); document.getElementById("ppl").textContent = st.ppl; renderFit(); }

function applyStatic(){
  document.documentElement.lang = LANG;
  document.title = LANG === "es" ? "Costa Rica en Cifras · Pobreza e ingresos explicados" : "Costa Rica in Numbers · Poverty and income explained";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });   // texto fijo del sitio
  document.querySelectorAll("[data-i18n-attr]").forEach(el => el.dataset.i18nAttr.split(";").forEach(pair => { const [a, k] = pair.split(":"); el.setAttribute(a, t(k)); }));
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === LANG ? "true" : "false"));
}
function setLang(l, save){
  LANG = l === "en" ? "en" : "es";
  if (save){ try { localStorage.setItem("crc-lang", LANG); } catch(e){} }
  applyStatic(); renderFit(); renderLadder(); renderTrend(); renderRegions(); renderHint(); renderAbout();
  [ddPlace, ddYear, ddA, ddB].forEach(d => d && d.rebuild());
  if (lastQ) showAnswer(lastQ);
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang, true)));

/* ========================= SOBRE EL PROYECTO · gráficos ========================= */
function renderAbout(){
  // 1 · 100 hogares, 15 en pobreza (ENAHO 2025)
  const w = document.getElementById("abWaffle"); if (!w) return;
  w.textContent = ""; w.setAttribute("viewBox", "0 0 200 200");
  const poor = Math.round(PLACES.cr.total[YEARS.length - 1]);
  for (let n = 0; n < 100; n++){ const r = Math.floor(n / 10), col = n % 10;
    w.append(S("circle", { cx:10 + col * 20, cy:10 + r * 20, r:7, fill: n >= 100 - poor ? "var(--accent)" : "rgba(248,250,255,.22)" })); }
  // 2 · línea nacional 2016–2025
  const sp = document.getElementById("abSpark"), W = 420, H = 200, P = { l:6, r:6, t:34, b:30 };
  sp.textContent = ""; sp.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const v = PLACES.cr.total, lo = 10, hi = 30, x = i => P.l + i * (W - P.l - P.r) / (v.length - 1), y = val => P.t + (hi - val) / (hi - lo) * (H - P.t - P.b);
  const d = v.map((val, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(val).toFixed(1)).join(" ");
  sp.append(S("path", { d: d + ` L${x(v.length - 1)} ${H - P.b} L${x(0)} ${H - P.b} Z`, fill:"rgba(4,0,70,.10)" }));
  sp.append(S("path", { d, fill:"none", stroke:"#040046", "stroke-width":4, "stroke-linejoin":"round", "stroke-linecap":"round" }));
  [[0, "start"], [v.length - 1, "end"]].forEach(([i, a]) => {
    sp.append(S("circle", { cx:x(i), cy:y(v[i]), r:7, fill:"#040046", stroke:"#ff651d", "stroke-width":3 }));
    const big = S("text", { x:x(i), y: i ? y(v[i]) + 40 : y(v[i]) - 16, "text-anchor":a, class:"pv__num" }); big.textContent = pct(v[i]); sp.append(big);
    const yr = S("text", { x:x(i), y:H - 6, "text-anchor":a, class:"pv__yr" }); yr.textContent = YEARS[i]; sp.append(yr); });
  // 4 · mapa con "vos estás aquí"
  const m = document.getElementById("abMap"); m.textContent = ""; m.setAttribute("viewBox", `0 0 ${MAP.w} ${MAP.h}`);
  const tone = { central:"#ff651d", chorotega:"#28469e", pacifico:"#4a3aff", norte:"#040046", brunca:"#2500c4", caribe:"#545281" };
  KEYS.forEach(k => m.append(S("path", { d:MAP.regions[k].d, fill:tone[k], stroke:"#f8faff", "stroke-width":3, "stroke-linejoin":"round" })));
  const [px, py] = MAP.regions.central.label, R = 46, cy = py - 70;
  m.append(S("ellipse", { cx:px, cy:py + 4, rx:18, ry:6, fill:"rgba(4,0,70,.35)" }));
  m.append(S("path", { d:`M${px} ${py} L ${px - R * .62} ${cy + R * .78} A ${R} ${R} 0 1 1 ${px + R * .62} ${cy + R * .78} Z`, fill:"#040046", stroke:"#f8faff", "stroke-width":5, "stroke-linejoin":"round" }));
  const lab = S("text", { x:px, y:cy + 10, "text-anchor":"middle", class:"pv__pin" }); lab.textContent = t("ab_you"); m.append(lab);
}

/* ========================= NAVEGACIÓN INTERNA · IN-PAGE LINKS =========================
   Los enlaces #seccion se manejan con JS para que funcionen igual en GitHub Pages,
   en el archivo descargado y dentro de visores con iframe o <base> (donde un href="#x"
   puede apuntar a otra URL). */
function goTo(id, push){
  const el = document.getElementById(id); if (!el) return false;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const navH = (document.querySelector(".nav") || {}).offsetHeight || 0;
  const y = el.getBoundingClientRect().top + scrollY - navH - 12;
  try { scrollTo({ top:y, behavior: reduce ? "auto" : "smooth" }); } catch(e){ scrollTo(0, y); }
  if (!el.hasAttribute("tabindex")) el.setAttribute("tabindex", "-1");
  try { el.focus({ preventScroll:true }); } catch(e){}
  if (push){ try { history.replaceState(null, "", "#" + id); } catch(e){} }
  return true;
}
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const id = decodeURIComponent(a.getAttribute("href").slice(1));
  if (!id || id === "es" || id === "en") return;
  if (goTo(id, true)) e.preventDefault();
});

/* ========================= INICIO · INIT ========================= */
let saved = null; try { saved = localStorage.getItem("crc-lang"); } catch(e){}
const fromHash = location.hash === "#en" || location.hash === "#es" ? location.hash.slice(1) : null;
LANG = fromHash || saved || ((navigator.language || "es").toLowerCase().startsWith("en") ? "en" : "es");
applyStatic();
var ddPlace = dropdown(document.getElementById("trendSelect"), { eyebrow:() => t("dd_region"), options:regionOptions, value:st.place, onChange:v => { st.place = v; renderTrend(); } });
var ddYear = dropdown(document.getElementById("yearSelect"), { eyebrow:() => t("dd_year"), options:() => YEARS.slice().reverse().map(y => ({ value:String(y), label:String(y), meta:pct(PLACES.cr.total[yi(y)]) + " " + t("opt_nat") })), value:"2025",
  onChange:v => { st.year = +v; ddA.rebuild(); ddB.rebuild(); renderRegions(); } });
var ddA = dropdown(document.getElementById("cmpA"), { eyebrow:() => t("dd_a"), options:regionOptions, value:st.a, onChange:v => { st.a = v; renderRegions(); } });
var ddB = dropdown(document.getElementById("cmpB"), { eyebrow:() => t("dd_b"), options:regionOptions, value:st.b, onChange:v => { st.b = v; renderRegions(); } });
renderFit(); renderLadder(); renderTrend(); renderRegions(); renderAbout();
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { renderTrend(); renderMap(); }, 150); });
}
</script>
